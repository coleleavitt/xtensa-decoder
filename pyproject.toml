[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xtensa-decoder"
version = "0.1.0"
description = "Complete Xtensa ISA decoder built from LLVM TableGen definitions"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Cole Leavitt", email = "cole@unwrap.rs" }
]
keywords = ["xtensa", "disassembler", "reverse-engineering", "firmware", "tensilica"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/coleleavitt/xtensa-decoder"
Repository = "https://github.com/coleleavitt/xtensa-decoder"
